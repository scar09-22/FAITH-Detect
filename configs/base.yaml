# Base configuration for FAITH-Detect experiments.
# Local smoke overrides these via CLI; the Colab notebook loads the "full" profile below.

name: base
data_csv: /Users/shiva/Detection+XAI/all_data.csv
encoder_name: roberta-base
variants: [baseline, hardmask, softreg]
fw_definition: union          # curated | stopwords | union
max_length: 256

# training
seeds: [0, 1, 2, 3, 4]        # >=5 for the full run
epochs: 4
batch_size: 16
lr: 2.0e-5
softreg_lambda: 1.0

# OOD (RAID). Local default is 'abstracts' (cheap cross-domain). Colab uses reviews+others.
ood_domains: [abstracts]
ood_cap_per_group: 150
ood_max_scan: 80000

# robustness
attack_types: [function_word, synonym, whitespace]
attack_rate: 0.5

# XAI
faithfulness_n_texts: 40
ig_steps: 32
n_example_explanations: 6

measure_leakage: true
out_dir: results
